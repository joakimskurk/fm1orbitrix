# ORBITRIX (on Dinghy 0.5): build the packages on GitHub, run the host tests, and on a tag vX.Y publish the release with a build
# attestation (actions/attest-build-provenance): the Firmware Hub shows "Built from source" for exactly these files.
# The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com, as in
# sloopDX's and OberVave's workflows. Run by hand (workflow_dispatch) for a test build without a release.
# On every push to main also the page (the site job below): ORBITRIX to play in the browser, the legend, the systems,
# the installer, on GitHub Pages.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow numpy

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (the SMK-37 first, the FM-1 last, as the tests expect)
        run: |
          BOARD=smk37 sh build.sh
          BOARD=smk37 MODEL=elite sh build.sh
          BOARD=smk37 MODEL=mke sh build.sh
          sh build.sh

      - name: Host tests
        run: sh tests/run_tests.sh

      - name: The engine's tests (and again under ASan/UBSan), the renders
        run: sh tests/run_orb.sh

      - name: Release packages (tags only)
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          BOARD=smk37 sh build.sh --release "$V"
          BOARD=smk37 MODEL=elite sh build.sh --release "$V"
          BOARD=smk37 MODEL=mke sh build.sh --release "$V"
          sh build.sh --release "$V"
          ls -l build/orbitrix-"$V"*.fwsc
          (cd build && sha256sum orbitrix-"$V"*.fwsc > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: orbitrix-fwsc
          path: build/orbitrix*.fwsc
          if-no-files-found: error

      - name: Attest the packages (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/orbitrix-[0-9]*.fwsc

      # (the release builds only, not the dev ones: orbitrix-smk37.fwsc – no comment inside the block below: it would be part of the pattern)
      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/orbitrix-[0-9]*.fwsc
            build/SHA256SUMS
          generate_release_notes: true

  # The page (GitHub Pages, https://joakimskurk.github.io/fm1orbitrix/): ORBITRIX to play in the browser (the
  # firmware's own code, WebAssembly), the legend's film, the systems to hear, and the installer with the package this
  # run built and tested. From main only; Pages takes its site from GitHub Actions (Settings -> Pages).
  site:
    needs: firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orbitrix-fwsc
          path: build
      - name: GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "on=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=GitHub Pages is off::Settings -> Pages -> Build and deployment -> Source: GitHub Actions, then run the build again"
            echo "on=0" >> "$GITHUB_OUTPUT"
          fi
      - name: ffmpeg, numpy and Pillow (the audio, the spectra, the legend); clang and lld (ORBITRIX for the browser)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-numpy python3-pil clang lld
      - name: The systems (the engine on the host) and the legend (an animation on a transparent night, its sound)
        run: |
          ORB_ASAN=0 sh tests/run_orb.sh
          python3 tools/make_legend.py
      - name: ORBITRIX to play on the page (the firmware's own code, WebAssembly)
        run: APP_VER="dev-${GITHUB_SHA::7}" sh web/app/build.sh
      - name: The site
        run: python3 web/make_site.py build/orbitrix.fwsc "dev-${GITHUB_SHA::7}" _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == '1'
        with:
          path: _site
      - id: deploy
        if: steps.pages.outputs.on == '1'
        uses: actions/deploy-pages@v4
